spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocknest}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8090
  # CORS: 프론트엔드 도메인 허용
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

chatbot:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}

# RAG + Vector DB
rag:
  chroma-url: ${CHROMA_URL:http://localhost:8100}
  collection-name: stock-knowledge
  embedding-model: ${EMBEDDING_MODEL:text-embedding-004}
  top-k: 5

# 한국투자증권 Open API
kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  base-url: https://openapi.koreainvestment.com:9443

logging:
  level:
    dev.stocknest: INFO
    org.springframework.web.socket: WARN
