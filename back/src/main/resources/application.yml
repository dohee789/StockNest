spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/stocknest?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8090

chatbot:
  model: ${GEMINI_MODEL:gemini-3.7-flash}

# RAG + Vector DB
rag:
  chroma-url: ${CHROMA_URL:http://localhost:8100}
  collection-name: stock-knowledge
  embedding-model: ${EMBEDDING_MODEL:text-embedding-004}
  top-k: 5

logging:
  level:
    dev.stocknest: INFO
    org.springframework.web.socket: WARN
