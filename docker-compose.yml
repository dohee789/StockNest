version: '3.8'

services:
  # ── ChromaDB (벡터 데이터베이스) ──
  chromadb:
    image: chromadb/chroma:latest
    container_name: stocksim-chroma
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ── n8n (워크플로우 자동화) ──
  n8n:
    image: n8nio/n8n:latest
    container_name: stocksim-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
    restart: unless-stopped

volumes:
  chroma_data:
  n8n_data:
