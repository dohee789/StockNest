version: '3.8'

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: stocknest-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stocknest}
      POSTGRES_USER: ${DB_USERNAME:-stocknest}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stocknest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Spring Boot Backend ──
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: stocknest-backend
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-stocknest}
      DB_USERNAME: ${DB_USERNAME:-stocknest}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      CHROMA_URL: http://chromadb:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TZ: Asia/Seoul
    ports:
      - "${SERVER_PORT:-8090}:8090"
    restart: unless-stopped

  # ── ChromaDB (Vector DB for RAG) ──
  chromadb:
    image: chromadb/chroma:latest
    container_name: stocknest-chroma
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8100:8000"
    restart: unless-stopped

  # ── n8n (Workflow Automation) ──
  n8n:
    image: n8nio/n8n:latest
    container_name: stocknest-n8n
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin123}
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
    ports:
      - "5678:5678"
    restart: unless-stopped

  # ── Nginx Reverse Proxy (HTTPS + 도메인) ──
  nginx:
    image: nginx:alpine
    container_name: stocknest-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  n8n_data:
  certbot_data:
  certbot_www:
